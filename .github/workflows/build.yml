name: Flutter CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - name: Verify Flutter and Dart
        run: |
          flutter --version
          dart --version

      - name: Generate Android platform files when android is absent
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: line-balance-platform-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
